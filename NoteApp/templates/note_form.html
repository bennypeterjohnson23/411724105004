{% extends 'base.html' %}

{% block content %}
<div class="panel small-panel">
    <h2>{{ action }} note</h2>
    <form method="post" class="form-stack">
        <label>
            Title
            <input type="text" name="title" value="{{ note.title if note else '' }}" required />
        </label>
        <label>
            Content
            <textarea name="content" rows="6" required>{{ note.content if note else '' }}</textarea>
        </label>
        <button type="submit" class="button primary">{{ action }} note</button>
        <a class="button secondary" href="{{ url_for('notes_list') }}">Cancel</a>
    </form>
</div>
{% endblock %}
